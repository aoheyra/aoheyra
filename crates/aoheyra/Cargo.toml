[package]
name = "aoheyra"
description = "Rust core and UniFFI surface for the aoheyra Android mesh messaging app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "aoheyra"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]
doctest = true

[dependencies]
ao_idents = { git = "https://github.com/aoheyra/aoIdents", tag = "v0.1.0" }
ao_mesh = { git = "https://github.com/aoheyra/aoMesh", tag = "v0.1.0" }
ao_network = { git = "https://github.com/aoheyra/aoNetwork", tag = "v0.1.0" }
# APP-04: SQLCipher is compiled from source (including its crypto provider) so
# the same encrypted format is used on the host and every Android ABI without
# a system libcrypto. See the PR for the options that were compared.
rusqlite = { version = "0.38", features = ["bundled-sqlcipher-vendored-openssl"] }
