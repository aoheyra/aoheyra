[package]
name = "aoheyra"
description = "Rust core and UniFFI surface for the aoheyra Android mesh messaging app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "aoheyra"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]
doctest = true

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
# Builds the pinned UniFFI CLI wrapper used by the Gradle binding task only.
bindgen = ["uniffi/cli"]
# Dedicated current-thread executor for the Android service thread. The
# sans-IO orchestrator stays independent of any async runtime.
runtime-tokio = ["dep:tokio"]

[dependencies]
# Pre-release siblings are untagged git sources on their default branches,
# matching aoMesh's own manifest. Cargo treats a tagged source as a different
# identity, so mixing tag and no tag duplicates Identity, LinkId and NodeId
# types across the seam. Release tags start at v0.1.0 and will be adopted by
# every crate together when they are cut.
ao_idents = { git = "https://github.com/aoheyra/aoIdents" }
ao_mesh = { git = "https://github.com/aoheyra/aoMesh", features = ["adapter"] }
ao_network = { git = "https://github.com/aoheyra/aoNetwork" }
# Engine randomness is injected (ADR 0004). The seeded implementation is used
# only by the runtime tests; production supplies its own CSPRNG.
rand_core = "0.9"
# Pinned so the library scaffolding, CLI wrapper and Gradle-generated bindings
# all use exactly the same UniFFI release. Newer releases require a higher MSRV
# than this workspace's Rust 1.85.
uniffi = "=0.29.4"
# APP-04: SQLCipher is compiled from source (including its crypto provider) so
# the same encrypted format is used on the host and every Android ABI without
# a system libcrypto. Version 0.42 bundles sqlcipher-src 420.x, which carries
# the patched SQLite for RUSTSEC-2026-0459. See the PR for the options compared.
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }
# aoIdents seals on the rand_core 0.6 trait line; messaging passes an injected
# CSPRNG through that trait to `Identity::seal`.
rand_core06 = { package = "rand_core", version = "0.6" }
# MIT licence, MSRV below 1.85; feature set limited to a current-thread
# executor with timers, as required by the Android foreground service.
tokio = { version = "1", features = ["rt", "time"], optional = true }
# Deterministic, versioned JSON for the diagnostics archive. Both crates are
# permissively licensed, already present in the pinned graph and limited to
# the std feature set; they replace hand-written JSON escaping.
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

[dev-dependencies]
rand = "0.9"
# aoIdents seals on the rand_core 0.6 trait line; rand 0.8 supplies a seeded
# CSPRNG for deterministic two-instance tests.
rand08 = { package = "rand", version = "0.8" }
