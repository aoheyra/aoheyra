name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: aoheyra/aoheyra-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    if: github.event.action != 'closed'
    name: rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --all-features
      - name: deny
        run: cargo deny check
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --all-features

  native:
    if: github.event.action != 'closed'
    name: android native libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 defaults to the removed "tools" package.
          packages: platform-tools
      - name: install NDK
        run: sdkmanager --install "ndk;25.1.8937393"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: build all ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.1.8937393
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o android/app/src/main/jniLibs build --release

  android:
    if: github.event.action != 'closed'
    name: android scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 defaults to the removed "tools" package.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: assemble, lint and test
        working-directory: android
        run: ./gradlew assembleDebug lintDebug test
