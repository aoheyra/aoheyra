# cargo-deny configuration (APP-01). Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # APP-03: `basic-toml` is pulled in only by `askama_derive` through
    # `uniffi-bindgen`, which runs at build time to generate Kotlin bindings.
    # It is not linked into the shipped Android cdylib. Remove this ignore
    # when UniFFI's bindgen no longer depends on `askama_derive`.
    { id = "RUSTSEC-2026-0374", reason = "build-time-only uniffi-bindgen dependency; not shipped" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # sqlcipher-src 420.0.0 declares "MIT AND BSD-3-Clause AND blessing AND WTFPL".
    "blessing",
    "WTFPL",
    # APP-03: UniFFI 0.29.4 and its generator crates are MPL-2.0.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# APP-01: sibling crates are private workspace dependencies consumed by git tag.
# cargo-deny treats git dependencies without a version as wildcard dependencies;
# allowing private git/path dependencies keeps the committed tag strategy while
# still denying wildcard requirements from crates.io.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/aoheyra/aoMesh",
    "https://github.com/aoheyra/aoNetwork",
    "https://github.com/aoheyra/aoIdents",
]
